name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64
          cache: maven
      - name: Build and verify Windows app
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          $version = '1.0.0'
          if ($env:IS_TAG -eq 'true') { $version = $env:RELEASE_REF -replace '^v', '' }
          ./scripts/build-windows.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: CampusVoice-windows-x64
          path: dist/**/*.zip
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $archives = @(Get-ChildItem dist -Recurse -Filter *.zip | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @archives --verify-tag --title "CampusVoice $env:RELEASE_TAG" --notes-file docs/WINDOWS-RELEASE.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
